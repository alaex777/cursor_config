[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "pydantic>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "import-linter>=2.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = false
mypy_path = ["src"]
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.importlinter]
root_packages = ["app"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain does not depend on outer layers or frameworks"
type = "forbidden"
include_external_packages = true
source_modules = ["app.domain"]
forbidden_modules = [
    "app.application",
    "app.infrastructure",
    "app.interfaces",
    "fastapi",
    "sqlalchemy",
    "pydantic",
    "httpx",
]

[[tool.importlinter.contracts]]
name = "Application does not depend on adapters or frameworks"
type = "forbidden"
include_external_packages = true
source_modules = ["app.application"]
forbidden_modules = [
    "app.infrastructure",
    "app.interfaces",
    "fastapi",
    "sqlalchemy",
    "httpx",
    "pydantic",
]

[[tool.importlinter.contracts]]
name = "Interfaces do not depend on infrastructure"
type = "forbidden"
include_external_packages = true
source_modules = ["app.interfaces"]
forbidden_modules = [
    "app.infrastructure",
    "sqlalchemy",
]
